name: icon_shift_generator
description: >-
  Build-time generator for icon_shift: creates Android activity-alias icons
  and labels, iOS alternate app icon sets and a Dart IconShiftConfig from one
  icon_shift.yaml.
version: 0.1.0
# TODO(publisher): set repository before publishing.

environment:
  sdk: ^3.8.0

executables:
  icon_shift_generator:

dependencies:
  args: ^2.7.0
  image: ^4.5.0
  path: ^1.9.0
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
