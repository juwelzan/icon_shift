name: icon_shift
description: >-
  Switch your app's icon and display name at runtime on Android, iOS, macOS,
  Windows, Linux and web, with shared and per-platform configuration and
  honest capability reporting.
version: 0.1.0
# TODO(publisher): set repository/homepage before publishing.
# repository: https://github.com/<owner>/icon_shift
topics:
  - app-icon
  - launcher-icon
  - branding
  - plugin

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  meta: ^1.15.0
  plugin_platform_interface: ^2.1.8
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.icon_shift
        pluginClass: IconShiftPlugin
      ios:
        pluginClass: IconShiftPlugin
      linux:
        pluginClass: IconShiftPlugin
      macos:
        pluginClass: IconShiftPlugin
      windows:
        pluginClass: IconShiftPluginCApi
      web:
        pluginClass: IconShiftWeb
        fileName: icon_shift_web.dart
