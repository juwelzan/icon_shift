name: icon_shift_cli
description: >-
  Build-time tooling for the icon_shift plugin: native icon resources,
  application ids and names, PWA metadata, validation, preview, backups and
  rollback, from one icon_shift.yaml.
version: 0.2.0
# TODO(publisher): set repository before publishing.

environment:
  sdk: ^3.8.0

executables:
  icon_shift_cli:
  icon_shift: icon_shift_cli

dependencies:
  args: ^2.7.0
  image: ^4.5.0
  path: ^1.9.0
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
