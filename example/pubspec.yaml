name: icon_shift_example
description: "Demonstrates the icon_shift plugin."
publish_to: 'none'

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  icon_shift:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  icon_shift_generator:
    path: ../generator

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
